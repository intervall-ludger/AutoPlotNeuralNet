name: cnn
layout: sequential
theme: default
legend: true

# CNN classifier: feature maps shrink spatially while channel thickness grows
sizing:
  mode: spatial
  ref_resolution: 224
  ref_size: 38
  min_size: 5
  ref_channels: 64
  ref_width: 2.2
  min_width: 1.2
  max_width: 9.0

layers:
  - {type: input, name: img, channels: 3,   resolution: 224, caption: Image}
  - {type: conv,  name: c1,  channels: 64,  resolution: 224}
  - {type: pool,  name: p1,  channels: 64,  resolution: 112}
  - {type: conv,  name: c2,  channels: 128, resolution: 112}
  - {type: pool,  name: p2,  channels: 128, resolution: 56}
  - {type: conv,  name: c3,  channels: 256, resolution: 56}
  - {type: pool,  name: p3,  channels: 256, resolution: 28}
  - {type: conv,  name: c4,  channels: 512, resolution: 28}
  - {type: pool,  name: p4,  channels: 512, resolution: 14}
  # dense head: tall thin bars (explicit geometry, no spatial meaning)
  - {type: fc,      name: fc1, channels: 4096, caption: FC,      height: 30, width: 2.5, depth: 2.5}
  - {type: fc,      name: fc2, channels: 4096,                   height: 30, width: 2.5, depth: 2.5}
  - {type: softmax, name: out, channels: 1000, caption: Softmax, height: 30, width: 1.6, depth: 2.5}
