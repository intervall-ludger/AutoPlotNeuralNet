[project]
name = "autoplotneuralnet"
version = "0.1.0"
description = "Config-driven TikZ diagrams of neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "click>=8",
]

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
]
test = [
    "pytest>=8",
]

[project.scripts]
apnn = "apnn.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apnn"]
